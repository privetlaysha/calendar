<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Календарь публикаций</title>
<meta name="robots" content="noindex, nofollow">
<style>
  :root {
    --bg: #f4f8fd;
    --card: #ffffff;
    --ink: #24344a;
    --ink-soft: #6b7f96;
    --line: #dde8f3;
    --brand: #7fb3e8;
    --brand-deep: #4a86c5;
    --brand-soft: #e3eefb;
    --brand-bg: #f4f8fd;
    --reel: #4a86c5;
    --trial: #f7e5a8;
    --trial-ink: #8a7014;
    --post: #d9c7f0;
    --post-ink: #6a4d9e;
    --past: #f7f9fb;
    --yshort: #2fa866;
    --ylong: #e5484d;
    --ylong-ink: #ffffff;
  }
  body[data-brand="shopomaniia"] {
    --brand: #edaecd;
    --brand-deep: #c96f9b;
    --brand-soft: #fbe9f1;
    --brand-bg: #fdf5f8;
    --reel: #c96f9b;
    --trial: #f7e5a8;
    --trial-ink: #8a7014;
    --post: #c3d9f2;
    --post-ink: #3d6a9e;
    --line: #f3dee8;
  }
  body[data-brand="shopomaniia_2012"] {
    --brand: #93aecb;
    --brand-deep: #4f6f91;
    --brand-soft: #e6eef6;
    --brand-bg: #f4f7fa;
    --reel: #4f6f91;
    --post: #f0d6c2;
    --post-ink: #95603a;
    --line: #d9e3ee;
  }
  body[data-brand="shopomaniia_katalog"] {
    --brand: #a9c2a0;
    --brand-deep: #5f8455;
    --brand-soft: #eaf2e6;
    --brand-bg: #f6f9f4;
    --reel: #5f8455;
    --post: #dccbf0;
    --post-ink: #6a4d9e;
    --line: #dfe8da;
  }
  /* ---------- Тёмная тема (поверх цветов бренда) ---------- */
  body.dark, body.dark[data-brand] {
    --card: #1b212b;
    --ink: #e6ecf3;
    --ink-soft: #93a2b5;
    --line: #2c3542;
    --past: #161b23;
    --brand-bg: color-mix(in srgb, var(--brand-deep) 7%, #10141a);
    --brand-soft: color-mix(in srgb, var(--brand-deep) 22%, #1b212b);
    --trial: #6b5a24;
    --trial-ink: #f3dc8c;
    color-scheme: dark;
  }
  body.dark .chip.trial, body.dark .counters .sq.trial { border-color: rgba(255,255,255,.08); }
  body.dark .badge.pub { background: #1f3a2a; color: #7fd39c; }
  body.dark .badge.feed { background: #26303d; color: #aab8c9; }
  body.dark .thumb img { background: #232a35; }
  body.dark .fol .up { color: #5fd38a; }
  body.dark .channel-toggle button.active,
  body.dark .platform-tabs button.active { background: var(--brand-deep); border-color: var(--brand-deep); }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: var(--brand-bg);
    color: var(--ink);
    min-height: 100vh;
    transition: background .25s ease;
  }
  .wrap { max-width: 940px; margin: 0 auto; padding: 20px 16px 60px; }

  /* ---------- Экран входа ---------- */
  #lock {
    min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px;
    background: linear-gradient(160deg, #eaf2fb 0%, #f7fafd 60%, #fdf3f7 100%);
  }
  body.dark #lock { background: linear-gradient(160deg, #141b25 0%, #10141a 60%, #1d1520 100%); }
  .lock-card {
    background: var(--card); border-radius: 20px; padding: 40px 34px; width: 100%; max-width: 380px;
    box-shadow: 0 12px 40px rgba(60, 90, 130, .12); text-align: center;
  }
  .lock-card h1 { font-size: 22px; margin-bottom: 6px; }
  .lock-card p { color: var(--ink-soft); font-size: 14px; margin-bottom: 24px; }
  .lock-card input {
    background: var(--card); color: var(--ink);
    width: 100%; padding: 13px 16px; font-size: 17px; letter-spacing: 6px; text-align: center;
    border: 1.5px solid var(--line); border-radius: 12px; outline: none; margin-bottom: 14px;
  }
  .lock-card input:focus { border-color: var(--brand); }
  .lock-card button {
    width: 100%; padding: 13px; font-size: 15px; font-weight: 600; color: #fff;
    background: var(--brand-deep); border: none; border-radius: 12px; cursor: pointer;
  }
  .lock-card button:hover { opacity: .92; }
  #lock-err { color: #d05858; font-size: 13px; margin-top: 12px; min-height: 18px; }

  /* ---------- Шапка ---------- */
  header { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; margin-bottom: 16px; }
  h1.title { font-size: 21px; }
  .theme-btn {
    border: 1px solid var(--line); background: var(--card); color: var(--ink);
    width: 38px; height: 38px; border-radius: 12px; font-size: 17px; cursor: pointer;
  }
  .theme-btn:hover { border-color: var(--brand); }
  .updated { font-size: 12px; color: var(--ink-soft); width: 100%; }

  .channel-toggle { display: flex; justify-content: center; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
  .channel-toggle .ch { display: flex; flex-direction: column; align-items: center; gap: 5px; }
  .channel-toggle button {
    border: 1px solid var(--line); background: var(--card); padding: 9px 18px; border-radius: 12px;
    font-size: 13px; font-weight: 600; color: var(--ink-soft); cursor: pointer; transition: all .2s;
    width: 100%;
  }
  .channel-toggle button.active { background: var(--brand); border-color: var(--brand); color: #fff; }
  .channel-toggle button:not(.active):hover { border-color: var(--brand); }
  .fol { font-size: 12px; color: var(--ink); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .fol b { font-weight: 700; }
  .fol .up { color: #2e9b55; font-weight: 700; margin-left: 4px; }
  .fol .down { color: #d05858; font-weight: 700; margin-left: 4px; }

  /* ---------- Вкладки платформ ---------- */
  .platform-tabs { display: flex; justify-content: center; gap: 10px; margin: 2px 0 16px; }
  .platform-tabs button {
    border: 1px solid var(--line); background: var(--card); padding: 10px 30px; border-radius: 12px;
    font-size: 13px; font-weight: 700; letter-spacing: .06em; color: var(--ink-soft);
    cursor: pointer; transition: all .2s;
  }
  .platform-tabs button.active { background: var(--brand); border-color: var(--brand); color: #fff; }
  .platform-tabs button:not(.active):hover { border-color: var(--brand); }

  /* ---------- Навигация по месяцу ---------- */
  .month-nav { display: flex; align-items: center; justify-content: space-between; margin: 14px 0; }
  .month-nav h2 { font-size: 18px; text-transform: capitalize; }
  .month-nav button {
    border: 1px solid var(--line); background: var(--card); width: 38px; height: 38px; border-radius: 12px;
    font-size: 17px; cursor: pointer; color: var(--ink);
  }
  .month-nav button:disabled { opacity: .35; cursor: default; }

  /* ---------- Сетка календаря ---------- */
  .grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
  .dow { text-align: center; font-size: 11px; color: var(--ink-soft); padding: 6px 0; font-weight: 600; }
  .day {
    background: var(--card); border: 1px solid var(--line); border-radius: 12px;
    min-height: 78px; padding: 7px 8px; cursor: pointer; transition: border-color .15s, transform .1s;
  }
  .day:hover { border-color: var(--brand); }
  .day.selected { border: 2px solid var(--brand-deep); padding: 6px 7px; }
  .day.empty { background: transparent; border: none; cursor: default; }
  .day.past { opacity: .5; background: var(--past); }
  .day .num { font-size: 13px; font-weight: 600; margin-bottom: 5px; }
  .day.today .num {
    display: inline-block; background: var(--brand-deep); color: #fff; border-radius: 8px;
    padding: 1px 7px;
  }
  .chips { display: flex; flex-wrap: wrap; gap: 3px; }
  .chip { width: 14px; height: 14px; border-radius: 5px; }
  .chip.reel { background: var(--reel); }
  .chip.trial { background: var(--trial); border: 1px solid rgba(0,0,0,.06); }
  .chip.post { background: var(--post); }
  .more { font-size: 10px; color: var(--ink-soft); }

  /* ---------- Счётчики месяца ---------- */
  .counters { display: flex; justify-content: center; gap: 26px; margin-top: 14px; font-size: 14px; color: var(--ink); flex-wrap: wrap; }
  .counters .cnt { display: inline-flex; align-items: center; gap: 8px; }
  .counters .sq { width: 16px; height: 16px; border-radius: 5px; display: inline-block; }
  .counters .sq.reel { background: var(--reel); }
  .counters .sq.trial { background: var(--trial); border: 1px solid rgba(0,0,0,.06); }
  .counters .sq.post { background: var(--post); }
  .counters b { font-size: 15px; font-weight: 700; }
  .counters .lbl { color: var(--ink-soft); }
  /* ---------- Бренд недели ---------- */
  .botw {
    background: var(--brand-soft); border: 1px solid var(--line); border-radius: 14px;
    padding: 14px 16px; margin-top: 14px;
  }
  .botw-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
  .botw-label { font-size: 12px; color: var(--ink-soft); margin-bottom: 2px; }
  .botw-brand { font-size: 19px; font-weight: 700; }
  .botw-dates { font-size: 13px; color: var(--ink-soft); margin-top: 2px; }
  .botw-btn {
    border: 1px solid var(--brand); background: var(--card); color: var(--brand-deep);
    font-size: 12px; font-weight: 600; padding: 7px 12px; border-radius: 10px; cursor: pointer;
  }
  .botw-btn:hover { background: var(--brand-soft); }
  .botw-list { margin-top: 12px; border-top: 1px solid var(--line); padding-top: 8px; display: none; }
  .botw-item { display: flex; justify-content: space-between; gap: 10px; padding: 6px 0; font-size: 14px; color: var(--ink); }
  .botw-item .bw-dates { color: var(--ink-soft); white-space: nowrap; }
  .botw-item.current { font-weight: 700; }
  .botw-item.past { opacity: .5; }

  /* ---------- В этом месяце ---------- */
  .msum { margin-top: 22px; text-align: center; }
  .msum-title { font-size: 12px; font-weight: 700; letter-spacing: .12em; color: var(--ink-soft); margin-bottom: 10px; }
  .msum-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
  .mtile { border-radius: 14px; padding: 16px 10px 14px; box-shadow: 0 2px 8px rgba(40, 60, 90, .06); }
  .mtile .mv { font-size: 30px; line-height: 1.1; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .mtile .mv .arr { font-size: 22px; margin-left: 4px; }
  .mtile .ml { font-size: 14px; margin-top: 4px; }
  .mtile.views   { background: #8c97ee; color: #12164a; }
  .mtile.reach   { background: #9fc9a5; color: #1f3a24; }
  .mtile.engaged { background: #eeb5e6; color: #4a0f3d; }
  .mtile.content { background: #e0aa4f; color: #4d3208; }
  body.dark .mtile.views   { background: #3b437f; color: #e3e6ff; }
  body.dark .mtile.reach   { background: #335a3a; color: #dff3e2; }
  body.dark .mtile.engaged { background: #6c3762; color: #fde6f8; }
  body.dark .mtile.content { background: #74531d; color: #fbecd2; }
  @media (max-width: 700px) {
    .msum-grid { grid-template-columns: 1fr 1fr; gap: 8px; }
    .mtile .mv { font-size: 22px; }
    .mtile .mv .arr { font-size: 17px; }
    .mtile .ml { font-size: 12px; }
  }

  /* ---------- День ---------- */
  #day-panel { margin-top: 26px; }
  #day-panel h3 { font-size: 16px; margin-bottom: 12px; text-transform: capitalize; }
  .post-card {
    background: var(--card); border: 1px solid var(--line); border-radius: 16px;
    padding: 14px; margin-bottom: 12px; display: flex; gap: 14px; align-items: flex-start;
  }
  .thumb { flex: 0 0 128px; position: relative; }
  .thumb video, .thumb img {
    width: 128px; height: 180px; object-fit: cover; border-radius: 10px; background: #10151c;
  }
  .thumb video { cursor: pointer; }
  .thumb img { background: #eef2f7; display: block; }
  .play-overlay {
    position: absolute; inset: 0; display: none; align-items: center; justify-content: center;
    background: rgba(20, 25, 35, .35); border-radius: 10px; cursor: pointer;
  }
  .play-overlay .pbtn {
    width: 46px; height: 46px; border-radius: 50%; background: rgba(255, 255, 255, .92);
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 2px 10px rgba(0,0,0,.25);
  }
  .post-body { flex: 1; min-width: 0; }
  .post-top { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 7px; }
  .time { font-weight: 700; font-size: 14px; }
  .badge { font-size: 11px; font-weight: 700; padding: 3px 10px; border-radius: 999px; }
  .badge.reel { background: var(--reel); color: #fff; }
  .badge.trial { background: var(--trial); color: var(--trial-ink); }
  .badge.post { background: var(--post); color: var(--post-ink); }
  .badge.pub { background: #e5f4e9; color: #3b8a58; }
  .badge.feed { background: #eef1f6; color: #55677f; }
  .badge.yshort { background: var(--yshort); color: #fff; }
  .badge.ylong { background: var(--ylong); color: var(--ylong-ink); }
  .badge.sched { background: #fff1d6; color: #9a6a00; }
  .badge.priv { background: #eef1f6; color: #55677f; }
  body.dark .badge.sched { background: #3b301a; color: #f3c56b; }
  body.dark .badge.priv { background: #26303d; color: #aab8c9; }
  .chip.yshort, .counters .sq.yshort { background: var(--yshort); }
  .chip.ylong, .counters .sq.ylong { background: var(--ylong); }
  .chip.sched { opacity: .45; }
  .thumb.yt { cursor: pointer; }
  .thumb.yt .dur {
    position: absolute; right: 6px; bottom: 6px; background: rgba(0,0,0,.75); color: #fff;
    font-size: 11px; font-weight: 700; padding: 2px 6px; border-radius: 6px;
  }
  .thumb.yt .play-overlay { display: flex; background: rgba(20,25,35,.18); }
  .thumb iframe { width: 128px; height: 180px; border: 0; border-radius: 10px; background: #000; }
  .thumb.wide iframe { width: 240px; height: 135px; }
  .thumb.wide { flex-basis: 240px; }
  .thumb.wide img { width: 240px; height: 135px; }
  .yt-note { font-size: 11px; color: var(--ink-soft); text-align: center; margin-top: 4px; }
  .stats { display: flex; flex-wrap: wrap; gap: 6px; margin: 2px 0 9px; }
  .st {
    display: inline-flex; flex-direction: column; min-width: 64px; padding: 5px 9px;
    background: var(--brand-soft); border-radius: 9px; line-height: 1.15;
  }
  .st b { font-size: 13px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .st span { font-size: 10.5px; color: var(--ink-soft); }
  .st.main { background: var(--brand-deep); }
  .st.main b, .st.main span { color: #fff; }
  .st.main span { opacity: .85; }
  .post-title { font-size: 14px; font-weight: 600; margin-bottom: 6px; line-height: 1.35; }
  .post-text { font-size: 13px; color: var(--ink-soft); white-space: pre-wrap; line-height: 1.5; }
  .post-text.clamped { max-height: 60px; overflow: hidden; }
  .toggle-text {
    background: none; border: none; color: var(--brand-deep); font-size: 12px; cursor: pointer;
    padding: 0; margin-top: 6px; font-weight: 600;
  }
  .post-actions { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin-top: 8px; }
  .copy-btn {
    border: 1px solid var(--line); background: var(--card); color: var(--brand-deep);
    font-size: 12px; font-weight: 600; padding: 5px 11px; border-radius: 9px; cursor: pointer;
  }
  .copy-btn:hover { border-color: var(--brand); }
  .copy-btn.done { color: #2e9b55; border-color: #2e9b55; }
  .ig-btn {
    display: inline-flex; align-items: center; gap: 6px; text-decoration: none;
    background: var(--brand-deep); color: #fff; border: 1px solid var(--brand-deep);
    font-size: 12px; font-weight: 600; padding: 5px 12px; border-radius: 9px;
  }
  .ig-btn:hover { opacity: .9; }
  .ig-btn svg { width: 14px; height: 14px; }
  .post-link { font-size: 12px; color: var(--brand-deep); text-decoration: none; }
  .post-link:hover { text-decoration: underline; }

  .day-nav { display: flex; justify-content: space-between; gap: 10px; margin-top: 4px; }
  .day-nav button {
    display: inline-flex; align-items: center; gap: 8px;
    border: 1px solid var(--line); background: var(--card); color: var(--ink);
    font-size: 13px; font-weight: 600; padding: 10px 14px; border-radius: 12px; cursor: pointer;
  }
  .day-nav button:hover { border-color: var(--brand); color: var(--brand-deep); }
  .day-nav svg { width: 14px; height: 14px; flex: none; }
  .fol.nodata { color: var(--ink-soft); font-weight: 400; }
  .empty-day { color: var(--ink-soft); font-size: 14px; background: var(--card); border: 1px dashed var(--line); border-radius: 14px; padding: 22px; text-align: center; }

  @media (max-width: 560px) {
    .post-card { flex-direction: column; }
    .thumb video, .thumb img, .thumb iframe { width: 100% !important; height: 200px !important; }
    .thumb.yt { align-self: stretch; flex-basis: auto; }
    .channel-toggle { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 8px; }
    .channel-toggle button { padding: 8px 6px; font-size: 11.5px; }
  }
</style>
</head>
<body data-brand="peshkov">

<!-- Экран входа -->
<div id="lock">
  <div class="lock-card">
    <h1>Календарь публикаций</h1>
    <p>Контент-план Instagram и YouTube. Введите пароль.</p>
    <input id="pwd" type="password" inputmode="numeric" autocomplete="off" placeholder="••••">
    <button id="unlock-btn">Войти</button>
    <div id="lock-err"></div>
  </div>
</div>

<!-- Приложение -->
<div id="app" style="display:none">
  <div class="wrap">
    <header>
      <h1 class="title">Календарь публикаций</h1>
      <button class="theme-btn" id="theme-btn" title="Тёмная / светлая тема">☾</button>
      <div class="updated" id="updated"></div>
    </header>

    <div class="platform-tabs" id="platform-tabs">
      <button data-platform="instagram" class="active">INSTAGRAM</button>
      <button data-platform="youtube">YOUTUBE</button>
    </div>

    <div class="channel-toggle" id="channel-toggle"></div>

    <div class="month-nav">
      <button id="prev-month" title="Предыдущий месяц">‹</button>
      <h2 id="month-label"></h2>
      <button id="next-month" title="Следующий месяц">›</button>
    </div>

    <div class="grid" id="calendar"></div>

    <div class="counters" id="counters"></div>

    <div class="botw">
      <div class="botw-head">
        <div>
          <div class="botw-label">Бренд недели</div>
          <div class="botw-brand" id="botw-current"></div>
          <div class="botw-dates" id="botw-dates"></div>
        </div>
        <button class="botw-btn" id="botw-toggle">Все бренды недели</button>
      </div>
      <div class="botw-list" id="botw-list"></div>
    </div>

    <div class="msum" id="month-sum"></div>

    <div id="day-panel"></div>
  </div>
</div>

<script>
const PASS_HASH = "888df25ae35772424a560c7152a1de794440e0ea5cfee62828333a456a506e05";
const MONTHS = ["Январь","Февраль","Март","Апрель","Май","Июнь","Июль","Август","Сентябрь","Октябрь","Ноябрь","Декабрь"];
const DOWS = ["Пн","Вт","Ср","Чт","Пт","Сб","Вс"];

let DATA = null;
let YT = null;                    // data_youtube.json
/* Триал-рилсы с автопереходом в ленту (по заметкам из чата): brand|час триала -> дата выхода в ленту */
let FEED_MAP = {};
let platform = "instagram";       // instagram | youtube
let channel = "peshkov";          // instagram: peshkov|shopomaniia; youtube: yt-man|yt-classic|yt-shop
let viewYear, viewMonth;          // просматриваемый месяц
let selectedDay = null;           // "YYYY-MM-DD"
let todayStr = "";

const pad = n => String(n).padStart(2, "0");
const fmtNum = n => Number(n).toLocaleString("ru-RU");
const dayKey = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;

async function sha256(text) {
  const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(text));
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, "0")).join("");
}

/* ---------- Вход ---------- */
async function tryUnlock() {
  const v = document.getElementById("pwd").value;
  const err = document.getElementById("lock-err");
  if (await sha256(v) === PASS_HASH) {
    sessionStorage.setItem("cal_unlocked", "1");
    boot();
  } else {
    err.textContent = "Неверный пароль";
    document.getElementById("pwd").value = "";
  }
}
document.getElementById("unlock-btn").addEventListener("click", tryUnlock);
document.getElementById("pwd").addEventListener("keydown", e => { if (e.key === "Enter") tryUnlock(); });

/* ---------- Загрузка ---------- */
async function boot() {
  document.getElementById("lock").style.display = "none";
  document.getElementById("app").style.display = "block";
  const res = await fetch("data.json?ts=" + Date.now());
  DATA = await res.json();

}

/* Подписчики на выбранный день (история из Metricool); без выбранного дня,
   а также для сегодня/будущего — последний доступный день */
function shiftDay(k, n) {
  const [y, m, d] = k.split("-").map(Number);
  return dayKey(new Date(y, m - 1, d + n));
}
function followersFor(id) {
  const hist = (DATA.followersHistory || {})[id];
  const latest = (DATA.followers || {})[id];
  if (!selectedDay || !hist) return latest ? { ...latest, latest: true } : null;
  if (hist[selectedDay] != null) {
    const prev = hist[shiftDay(selectedDay, -1)];
    return { count: hist[selectedDay], delta: prev != null ? hist[selectedDay] - prev : null, date: selectedDay };
  }
  const days = Object.keys(hist).sort();
  if (days.length && selectedDay > days[days.length - 1]) return latest ? { ...latest, latest: true } : null;
  return null;
}

/* ---------- YouTube ---------- */
const YT_THEME = { "yt-man": "peshkov", "yt-classic": "peshkov", "yt-shop": "shopomaniia" };
function brandTheme() { return platform === "instagram" ? channel : (YT_THEME[channel] || "peshkov"); }
function ytChan(id) { return YT && YT.channels && YT.channels[id]; }
/* Подписчики YouTube на выбранный день: текущее число минус нетто-прирост следующих дней (Analytics)
   (для выбранного дня, иначе за последний день с данными). У CLASSIC Analytics нет —
   прирост считаем по сохранённой истории, если она есть. */
function ytFollowersFor(id) {
  const c = ytChan(id);
  if (!c) return null;
  const daily = c.daily || {};
  const ks = Object.keys(daily).sort();
  const last = ks.length ? ks[ks.length - 1] : null;
  if (last) {
    // день без выбора или позже последних данных Analytics — последний доступный день
    const day = !selectedDay || selectedDay > last ? last : (daily[selectedDay] ? selectedDay : null);
    if (day) {
      // число на конец дня = текущее − нетто-прирост всех следующих дней
      let count = c.subs;
      ks.forEach(k => { if (k > day) count -= daily[k][1]; });
      return { count, delta: daily[day][1], date: day };
    }
  }
  const h = c.subsHistory || {};
  if (selectedDay && h[selectedDay] != null && h[shiftDay(selectedDay, -1)] != null)
    return { count: h[selectedDay], delta: h[selectedDay] - h[shiftDay(selectedDay, -1)], date: selectedDay };
  return { count: c.subs, delta: null, date: todayStr };
}
const isYtSched = v => v.status === "scheduled";

/* ---------- Календарь ---------- */
function postsByDay() {
  const map = {};
  if (platform !== "instagram") {
    (YT ? YT.videos : []).filter(v => v.channel === channel).forEach(v => {
      const k = v.date.slice(0, 10);
      (map[k] = map[k] || []).push(v);
    });
    Object.values(map).forEach(list => list.sort((a, b) => a.date.localeCompare(b.date)));
    return map;
  }
  DATA.posts.filter(p => p.brand === channel).forEach(p => {
    const k = p.date.slice(0, 10);
    (map[k] = map[k] || []).push(p);
  });
  Object.values(map).forEach(list => list.sort((a, b) => a.date.localeCompare(b.date)));
  return map;
}

        const c = document.createElement("div");

          : (p.manual || isImgPost(p)) ? "post" : p.trial ? "trial" : "reel");
        c.title = p.title;
        chips.appendChild(c);
      });
      if (posts.length > 6) {

        m.className = "more"; m.textContent = "+" + (posts.length - 6);
        chips.appendChild(m);
      }

    cell.onclick = () => { selectedDay = k; render(); };

/* «В этом месяце»: сумма за открытый месяц по выбранному аккаунту (Metricool Evolution).
   Стрелка — сравнение с тем же числом дней предыдущего месяца. */
const MONTHS_PREP = ["январе","феврале","марте","апреле","мае","июне","июле","августе","сентябре","октябре","ноябре","декабре"];
function monthAgg(daily, y, m, maxDay) {
  const ym = `${y}-${pad(m + 1)}`;
  let views = 0, reachSum = 0, reachDays = 0, engaged = 0, content = 0, days = 0;
  Object.entries(daily).forEach(([d, v]) => {
    if (d.slice(0, 7) !== ym || +d.slice(8, 10) > maxDay || d >= todayStr) return;   // сегодня — неполный день
    days++;
    const [vw, rc, en, ct] = v;
    views += vw || 0; engaged += en || 0; content += ct || 0;
    if (rc != null) { reachSum += rc; reachDays++; }
  });
  return days ? { views, reach: reachDays ? Math.round(reachSum / reachDays) : 0, engaged, content, days } : null;
}
function fmtBig(n) {
  if (n >= 1e6) return (n / 1e6).toFixed(2).replace(".", ",") + " млн";
  return fmtNum(n);
}
function renderYtMonthSummary(el) {
  const c = ytChan(channel);
  const ym = `${viewYear}-${pad(viewMonth + 1)}`;
  const vids = (YT ? YT.videos : []).filter(v => v.channel === channel && v.date.slice(0, 7) === ym && !isYtSched(v));
  if (!c || (!vids.length && !c.daily)) { el.innerHTML = ""; return; }
  const isNow = todayStr.slice(0, 7) === ym;
  const title = isNow ? "В ЭТОМ МЕСЯЦЕ" : `В ${MONTHS_PREP[viewMonth].toUpperCase()}`;
  // сумма по дням месяца (Analytics) + сравнение с тем же числом дней прошлого месяца
  const agg = (y, m, maxDay) => {
    const p = `${y}-${pad(m + 1)}`; let views = 0, subs = 0, hours = 0, days = 0;
    Object.entries(c.daily || {}).forEach(([d, v]) => {
      if (d.slice(0, 7) !== p || +d.slice(8, 10) > maxDay) return;
      days++; views += v[0]; subs += v[1]; hours += v[2];
    });
    return days ? { views, subs, hours: Math.round(hours), days } : null;
  };
  const cur = agg(viewYear, viewMonth, 31);
  const tiles = [];
  let lastDay = 0, prev = null, pm = 0;
  if (cur) {
    lastDay = Math.max(...Object.keys(c.daily).filter(d => d.slice(0, 7) === ym).map(d => +d.slice(8, 10)));
    const py = viewMonth === 0 ? viewYear - 1 : viewYear; pm = viewMonth === 0 ? 11 : viewMonth - 1;
    prev = agg(py, pm, lastDay);
    tiles.push(["views", "Просмотры канала", cur.views, prev && prev.views],
               ["reach", "Новые подписчики", cur.subs, prev && prev.subs],
               ["engaged", "Часы просмотра", cur.hours, prev && prev.hours]);
  } else {
    tiles.push(["views", "Просмотры роликов месяца", vids.reduce((s, v) => s + ((v.stats || {}).views || 0), 0), null],
               ["engaged", "Лайки роликов месяца", vids.reduce((s, v) => s + ((v.stats || {}).likes || 0), 0), null]);
  }
  tiles.push(["content", "Роликов вышло", vids.length, null]);
  el.innerHTML = `<div class="msum-title">${title}</div><div class="msum-grid">` + tiles.map(([k, label, v, pv]) => {
    let arr = "", hint = "";
    if (pv != null && pv !== v) {
      arr = `<span class="arr">${v > pv ? "↑" : "↓"}</span>`;
      hint = ` title="1–${lastDay} ${MONTHS_GEN[pm]}: ${fmtNum(pv)}"`;
    }
    return `<div class="mtile ${k}"${hint}><div class="mv">${fmtBig(v)}${arr}</div><div class="ml">${label}</div></div>`;
  }).join("") + `</div>` + (cur ? `<div class="yt-note">YouTube Analytics — данные по ${lastDay} ${MONTHS_GEN[viewMonth]} (отставание 1–3 дня)</div>`
    : `<div class="yt-note">Только публичные данные: канал не подключён к YouTube Analytics</div>`);
}
function renderMonthSummary() {
  const el = document.getElementById("month-sum");
  if (platform === "youtube") { renderYtMonthSummary(el); return; }
  const daily = platform === "instagram" && DATA.daily && DATA.daily[channel];
  if (!daily) { el.innerHTML = ""; return; }
  const cur = monthAgg(daily, viewYear, viewMonth, 31);
  if (!cur) { el.innerHTML = ""; return; }
  const lastDay = Math.max(...Object.keys(daily)
    .filter(d => d.slice(0, 7) === `${viewYear}-${pad(viewMonth + 1)}` && d < todayStr).map(d => +d.slice(8, 10)));
  const py = viewMonth === 0 ? viewYear - 1 : viewYear, pm = viewMonth === 0 ? 11 : viewMonth - 1;
  const prev = monthAgg(daily, py, pm, lastDay);
  const isNow = todayStr.slice(0, 7) === `${viewYear}-${pad(viewMonth + 1)}`;
  const title = isNow ? "В ЭТОМ МЕСЯЦЕ" : `В ${MONTHS_PREP[viewMonth].toUpperCase()}`;
  const tiles = [["views", "Просмотры"], ["reach", "Средний охват в день"], ["engaged", "Вовлечённые аккаунты"], ["content", "Всего контента"]];
  el.innerHTML = `<div class="msum-title">${title}</div><div class="msum-grid">` + tiles.map(([k, label]) => {
    let arr = "", hint = "";
    if (prev && prev[k] !== cur[k]) {
      arr = `<span class="arr">${cur[k] > prev[k] ? "↑" : "↓"}</span>`;
      hint = ` title="1–${lastDay} ${MONTHS_GEN[pm]}: ${fmtNum(prev[k])}"`;
    }
    return `<div class="mtile ${k}"${hint}><div class="mv">${fmtBig(cur[k])}${arr}</div><div class="ml">${label}</div></div>`;
  }).join("") + `</div>`;
}

function esc(s) {

}

}

          <button class="toggle-text" onclick="toggleText(${idx}, this)">Показать текст полностью</button>` : ""}
          <div class="post-actions">
            <a class="ig-btn" href="${esc(v.url)}" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M21.6 7.2a2.5 2.5 0 0 0-1.8-1.8C18.2 5 12 5 12 5s-6.2 0-7.8.4A2.5 2.5 0 0 0 2.4 7.2 26 26 0 0 0 2 12a26 26 0 0 0 .4 4.8 2.5 2.5 0 0 0 1.8 1.8c1.6.4 7.8.4 7.8.4s6.2 0 7.8-.4a2.5 2.5 0 0 0 1.8-1.8A26 26 0 0 0 22 12a26 26 0 0 0-.4-4.8zM10 15V9l5.2 3L10 15z"/></svg>Открыть на YouTube</a>
            <button class="copy-btn" onclick="copyLink(${idx}, this)">Скопировать ссылку на публикацию</button>
            <button class="copy-btn" onclick="copyYtText(${idx}, this)">Скопировать текст поста</button>
          </div>
        </div>
      </div>`;
  });
  panel.innerHTML = html + dayNavHtml();
  DAY_POSTS = vids;
}
/* Клик по превью — встроенный плеер YouTube прямо в карточке */
window.playYt = idx => {
  const v = DAY_POSTS[idx], el = document.getElementById("yth-" + idx);
  if (!v || !el || el.querySelector("iframe")) return;
  el.innerHTML = `<iframe src="https://www.youtube-nocookie.com/embed/${v.id}?autoplay=1&rel=0" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe>`;
};
window.copyYtText = (idx, btn) => {
  const v = DAY_POSTS[idx];
  copyToClipboard(v ? (v.title + (v.text ? "\n\n" + v.text : "")) : "", btn);
};

/* Статистика опубликованного поста (Metricool, органика) */
const STAT_LABELS = [
  ["views", "Просмотры"], ["reach", "Охват"], ["likes", "Лайки"], ["comments", "Комменты"],
  ["saved", "Сохранения"], ["shares", "Репосты"], ["follows", "Подписки"],
  ["avgWatch", "Ср. досмотр"], ["viewRate", "Досмотр 3с+"],
  ["viewPct", "Досмотр, %"], ["watchH", "Часы просмотра"],
];
function fmtCompact(n) {
  if (n >= 1e6) return (n / 1e6).toFixed(n >= 1e7 ? 0 : 1).replace(".", ",") + " млн";
  if (n >= 1e4) return (n / 1e3).toFixed(n >= 1e5 ? 0 : 1).replace(".", ",") + " тыс";
  return fmtNum(n);
}
function statsHtml(st) {
  if (!st) return "";
  const items = STAT_LABELS.filter(([k]) => st[k] != null).map(([k, label], i) => {
    let v = st[k];
    if (k === "avgWatch") v = String(v).replace(".", ",") + " с";
    else if (k === "viewRate" || k === "viewPct") v = String(v).replace(".", ",") + "%";
    else if (k === "watchH") v = String(v).replace(".", ",") + " ч";
    else v = fmtCompact(v);
    const exact = typeof st[k] === "number" ? fmtNum(st[k]) : st[k];
    return `<div class="st${k === "views" ? " main" : ""}" title="${label}: ${exact}"><b>${v}</b><span>${label}</span></div>`;
  });
  return items.length ? `<div class="stats">${items.join("")}</div>` : "";
}

/* Текст без повтора заголовка: если пост начинается с той же строки — срезаем её */
function bodyText(p) {
  const text = (p.text || "").trim();
  const title = (p.title || "").trim();
  if (title && text.startsWith(title)) return text.slice(title.length).replace(/^\s+/, "");
  return text;
}

/* Копирование полного текста поста (как в Metricool, с заголовком) и ссылки на пост */
let DAY_POSTS = [];
window.copyText = (idx, btn) => copyToClipboard((DAY_POSTS[idx] && DAY_POSTS[idx].text) || "", btn);
window.copyLink = (idx, btn) => copyToClipboard((DAY_POSTS[idx] && DAY_POSTS[idx].url) || "", btn);
/* Скачивание видео: Metricool отдаёт CORS *, поэтому качаем как blob и сохраняем
   с понятным именем; если не вышло — открываем файл в новой вкладке */
window.downloadVideo = async (idx, btn) => {
  const p = DAY_POSTS[idx];
  if (!p || !p.video || btn.disabled) return;
  const label = "Скачать видео";
  const brand = (DATA.brands.find(b => b.id === p.brand) || {}).name || p.brand;
  const name = `${brand} ${p.date.slice(0, 10)} ${p.date.slice(11, 16).replace(":", "-")} ${p.title}`
    .replace(/[\\/:*?"<>|#%]+/g, "").replace(/\s+/g, " ").trim().slice(0, 90) + ".mp4";
  btn.disabled = true;
  try {
    const res = await fetch(p.video);
    if (!res.ok) throw new Error(res.status);
    const total = +res.headers.get("content-length") || 0;
    const reader = res.body.getReader();
    const chunks = []; let got = 0;
    for (;;) {
      const { done, value } = await reader.read();
      if (done) break;
      chunks.push(value); got += value.length;
      btn.textContent = total ? `Скачивание… ${Math.round(got / total * 100)}%` : `Скачивание… ${Math.round(got / 1048576)} МБ`;
    }
    const url = URL.createObjectURL(new Blob(chunks, { type: "video/mp4" }));
    const a = document.createElement("a");
    a.href = url; a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 60000);
    btn.textContent = "Скачано ✓"; btn.classList.add("done");
  } catch (e) {
    window.open(p.video, "_blank", "noopener");
    btn.textContent = label;
  }
  setTimeout(() => { btn.textContent = label; btn.classList.remove("done"); btn.disabled = false; }, 2500);
};

async function copyToClipboard(text, btn) {
  const label = btn.textContent;
  try {
    await navigator.clipboard.writeText(text);
  } catch (e) {
    const ta = document.createElement("textarea");
    ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.select();
    try { document.execCommand("copy"); } catch (e2) {}
    ta.remove();
  }
  btn.textContent = "Скопировано ✓"; btn.classList.add("done");
  setTimeout(() => { btn.textContent = label; btn.classList.remove("done"); }, 1600);
}

window.toggleText = (idx, btn) => {
  const el = document.getElementById("txt-" + idx);
  el.classList.toggle("clamped");
  btn.textContent = el.classList.contains("clamped") ? "Показать текст полностью" : "Свернуть текст";
};

/* Картинка (карусель/пост) — <img>, видео (рилс) — <video> с первым кадром */
function mediaHtml(url) {
  if (!url) return '<div class="thumb"></div>';
  if (/\.(png|jpe?g|webp|gif|avif)(\?|#|$)/i.test(url)) {
    return `<div class="thumb"><img src="${esc(url)}" alt="" loading="lazy"></div>`;
  }
  return `<div class="thumb"><video muted playsinline preload="metadata" data-src="${esc(url)}"></video></div>`;
}

/* Превью: показываем первый кадр, клик — play/pause со звуком,
   на паузе — полупрозрачная кнопка play поверх видео */
function initVideos() {
  document.querySelectorAll("#day-panel video").forEach(v => {
    const wrap = v.closest(".thumb");
    let ov = wrap.querySelector(".play-overlay");
    if (!ov) {
      ov = document.createElement("div");
      ov.className = "play-overlay";
      ov.innerHTML = '<div class="pbtn"><svg viewBox="0 0 24 24" width="22" height="22"><path d="M8 5v14l11-7z" fill="#24344a"/></svg></div>';
      wrap.appendChild(ov);
    }
    let started = false;
    const show = () => { ov.style.display = "flex"; };
    const hide = () => { ov.style.display = "none"; };
    v.src = v.dataset.src + "#t=0.1";
    v.addEventListener("loadedmetadata", () => { try { v.currentTime = 0.1; } catch (e) {} });
    v.addEventListener("play", () => { started = true; hide(); });
    v.addEventListener("pause", () => { if (started && !v.ended) show(); });
    v.addEventListener("ended", () => { started = false; v.currentTime = 0; show(); });
    const toggle = () => {
      if (v.paused) { v.muted = false; v.play(); }
      else { v.pause(); }
    };
    v.addEventListener("click", toggle);
    ov.addEventListener("click", toggle);
  });
}

  ["New Balance", "2026-09-14", "2026-09-27"],
  ["Timberland", "2026-09-28", "2026-10-11"],
  ["UGG", "2026-10-12", "2026-10-25"],
  ["Aritzia", "2026-10-26", "2026-11-08"],
  ["Costco", "2026-11-09", "2026-11-22"],
  ["Tiffany", "2026-11-23", "2026-12-06"],
  ["Ralph Lauren", "2026-12-07", "2026-12-20"],
  ["Beauty (все бренды косметики)", "2026-12-21", "2027-01-03"],
];
const MONTHS_GEN = ["января","февраля","марта","апреля","мая","июня","июля","августа","сентября","октября","ноября","декабря"];

function fmtRange(start, end) {
  const s = new Date(start + "T00:00:00"), e = new Date(end + "T00:00:00");
  return `${s.getDate()} ${MONTHS_GEN[s.getMonth()]} — ${e.getDate()} ${MONTHS_GEN[e.getMonth()]}`;
}

function initBrandOfWeek() {
  const curEl = document.getElementById("botw-current");
  const datesEl = document.getElementById("botw-dates");
  const listEl = document.getElementById("botw-list");
  const btn = document.getElementById("botw-toggle");

  let currentIdx = BRAND_WEEKS.findIndex(([ , s, e]) => todayStr >= s && todayStr <= e);
  if (currentIdx === -1) {
    const next = BRAND_WEEKS.findIndex(([ , s]) => s > todayStr);
    currentIdx = next === -1 ? BRAND_WEEKS.length - 1 : next;
  }
  const [name, start, end] = BRAND_WEEKS[currentIdx];
  const isCurrent = todayStr >= start && todayStr <= end;
  curEl.textContent = name;
  datesEl.textContent = fmtRange(start, end) + (isCurrent ? "" : (todayStr < start ? " (скоро)" : " (завершено)"));

  listEl.innerHTML = BRAND_WEEKS.map(([n, s, e], i) => {
    const cls = i === currentIdx ? "botw-item current" : (e < todayStr ? "botw-item past" : "botw-item");
    return `<div class="${cls}"><span>${n}</span><span class="bw-dates">${fmtRange(s, e)}</span></div>`;
  }).join("");

  btn.addEventListener("click", () => {
    const open = listEl.style.display !== "block";
    listEl.style.display = open ? "block" : "none";
    btn.textContent = open ? "Свернуть список" : "Все бренды недели";
  });
}

/* ---------- Месяцы ---------- */
document.getElementById("prev-month").addEventListener("click", () => {
  viewMonth--; if (viewMonth < 0) { viewMonth = 11; viewYear--; }
  render();
});
document.getElementById("next-month").addEventListener("click", () => {
  viewMonth++; if (viewMonth > 11) { viewMonth = 0; viewYear++; }
  render();
});

/* ---------- Тема ---------- */
function applyTheme(dark) {
  document.body.classList.toggle("dark", dark);
  document.getElementById("theme-btn").textContent = dark ? "☀" : "☾";
}
(() => {
  let saved = null;
  try { saved = localStorage.getItem("cal_theme"); } catch (e) {}
  const dark = saved ? saved === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
  applyTheme(dark);
})();
document.getElementById("theme-btn").addEventListener("click", () => {
  const dark = !document.body.classList.contains("dark");
  applyTheme(dark);
  try { localStorage.setItem("cal_theme", dark ? "dark" : "light"); } catch (e) {}
});

/* ---------- Старт ---------- */
if (sessionStorage.getItem("cal_unlocked") === "1") {
  boot();
} else {
  setTimeout(() => document.getElementById("pwd").focus(), 100);
}
