<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Календарь публикаций</title>
<meta name="robots" content="noindex, nofollow">
<style>
  :root {
    --bg: #f4f8fd;
    --card: #ffffff;
    --ink: #24344a;
    --ink-soft: #6b7f96;
    --line: #dde8f3;
    --brand: #7fb3e8;
    --brand-deep: #4a86c5;
    --brand-soft: #e3eefb;
    --brand-bg: #f4f8fd;
    --reel: #4a86c5;
    --trial: #f7e5a8;
    --trial-ink: #8a7014;
    --post: #d9c7f0;
    --post-ink: #6a4d9e;
    --past: #f7f9fb;
  }
  body[data-brand="shopomaniia"] {
    --brand: #edaecd;
    --brand-deep: #c96f9b;
    --brand-soft: #fbe9f1;
    --brand-bg: #fdf5f8;
    --reel: #c96f9b;
    --trial: #f7e5a8;
    --trial-ink: #8a7014;
    --post: #c3d9f2;
    --post-ink: #3d6a9e;
    --line: #f3dee8;
  }
  body[data-brand="shopomaniia_2012"] {
    --brand: #93aecb;
    --brand-deep: #4f6f91;
    --brand-soft: #e6eef6;
    --brand-bg: #f4f7fa;
    --reel: #4f6f91;
    --post: #f0d6c2;
    --post-ink: #95603a;
    --line: #d9e3ee;
  }
  body[data-brand="shopomaniia_katalog"] {
    --brand: #a9c2a0;
    --brand-deep: #5f8455;
    --brand-soft: #eaf2e6;
    --brand-bg: #f6f9f4;
    --reel: #5f8455;
    --post: #dccbf0;
    --post-ink: #6a4d9e;
    --line: #dfe8da;
  }
  /* ---------- Тёмная тема (поверх цветов бренда) ---------- */
  body.dark, body.dark[data-brand] {
    --card: #1b212b;
    --ink: #e6ecf3;
    --ink-soft: #93a2b5;
    --line: #2c3542;
    --past: #161b23;
    --brand-bg: color-mix(in srgb, var(--brand-deep) 7%, #10141a);
    --brand-soft: color-mix(in srgb, var(--brand-deep) 22%, #1b212b);
    --trial: #6b5a24;
    --trial-ink: #f3dc8c;
    color-scheme: dark;
  }
  body.dark .chip.trial, body.dark .counters .sq.trial { border-color: rgba(255,255,255,.08); }
  body.dark .badge.pub { background: #1f3a2a; color: #7fd39c; }
  body.dark .badge.feed { background: #26303d; color: #aab8c9; }
  body.dark .thumb img { background: #232a35; }
  body.dark .fol .up { color: #5fd38a; }
  body.dark .channel-toggle button.active,
  body.dark .platform-tabs button.active { background: var(--brand-deep); border-color: var(--brand-deep); }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: var(--brand-bg);
    color: var(--ink);
    min-height: 100vh;
    transition: background .25s ease;
  }
  .wrap { max-width: 940px; margin: 0 auto; padding: 20px 16px 60px; }

  /* ---------- Экран входа ---------- */
  #lock {
    min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px;
    background: linear-gradient(160deg, #eaf2fb 0%, #f7fafd 60%, #fdf3f7 100%);
  }
  body.dark #lock { background: linear-gradient(160deg, #141b25 0%, #10141a 60%, #1d1520 100%); }
  .lock-card {
    background: var(--card); border-radius: 20px; padding: 40px 34px; width: 100%; max-width: 380px;
    box-shadow: 0 12px 40px rgba(60, 90, 130, .12); text-align: center;
  }
  .lock-card h1 { font-size: 22px; margin-bottom: 6px; }
  .lock-card p { color: var(--ink-soft); font-size: 14px; margin-bottom: 24px; }
  .lock-card input {
    background: var(--card); color: var(--ink);
    width: 100%; padding: 13px 16px; font-size: 17px; letter-spacing: 6px; text-align: center;
    border: 1.5px solid var(--line); border-radius: 12px; outline: none; margin-bottom: 14px;
  }
  .lock-card input:focus { border-color: var(--brand); }
  .lock-card button {
    width: 100%; padding: 13px; font-size: 15px; font-weight: 600; color: #fff;
    background: var(--brand-deep); border: none; border-radius: 12px; cursor: pointer;
  }
  .lock-card button:hover { opacity: .92; }
  #lock-err { color: #d05858; font-size: 13px; margin-top: 12px; min-height: 18px; }

  /* ---------- Шапка ---------- */
  header { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; margin-bottom: 16px; }
  h1.title { font-size: 21px; }
  .theme-btn {
    border: 1px solid var(--line); background: var(--card); color: var(--ink);
    width: 38px; height: 38px; border-radius: 12px; font-size: 17px; cursor: pointer;
  }
  .theme-btn:hover { border-color: var(--brand); }
  .updated { font-size: 12px; color: var(--ink-soft); width: 100%; }

  .channel-toggle { display: flex; justify-content: center; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
  .channel-toggle .ch { display: flex; flex-direction: column; align-items: center; gap: 5px; }
  .channel-toggle button {
    border: 1px solid var(--line); background: var(--card); padding: 9px 18px; border-radius: 12px;
    font-size: 13px; font-weight: 600; color: var(--ink-soft); cursor: pointer; transition: all .2s;
    width: 100%;
  }
  .channel-toggle button.active { background: var(--brand); border-color: var(--brand); color: #fff; }
  .channel-toggle button:not(.active):hover { border-color: var(--brand); }
  .fol { font-size: 12px; color: var(--ink); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .fol b { font-weight: 700; }
  .fol .up { color: #2e9b55; font-weight: 700; margin-left: 4px; }
  .fol .down { color: #d05858; font-weight: 700; margin-left: 4px; }

  /* ---------- Вкладки платформ ---------- */
  .platform-tabs { display: flex; justify-content: center; gap: 10px; margin: 2px 0 16px; }
  .platform-tabs button {
    border: 1px solid var(--line); background: var(--card); padding: 10px 30px; border-radius: 12px;
    font-size: 13px; font-weight: 700; letter-spacing: .06em; color: var(--ink-soft);
    cursor: pointer; transition: all .2s;
  }
  .platform-tabs button.active { background: var(--brand); border-color: var(--brand); color: #fff; }
  .platform-tabs button:not(.active):hover { border-color: var(--brand); }

  /* ---------- Навигация по месяцу ---------- */
  .month-nav { display: flex; align-items: center; justify-content: space-between; margin: 14px 0; }
  .month-nav h2 { font-size: 18px; text-transform: capitalize; }
  .month-nav button {
    border: 1px solid var(--line); background: var(--card); width: 38px; height: 38px; border-radius: 12px;
    font-size: 17px; cursor: pointer; color: var(--ink);
  }
  .month-nav button:disabled { opacity: .35; cursor: default; }

  /* ---------- Сетка календаря ---------- */
  .grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
  .dow { text-align: center; font-size: 11px; color: var(--ink-soft); padding: 6px 0; font-weight: 600; }
  .day {
    background: var(--card); border: 1px solid var(--line); border-radius: 12px;
    min-height: 78px; padding: 7px 8px; cursor: pointer; transition: border-color .15s, transform .1s;
  }
  .day:hover { border-color: var(--brand); }
  .day.selected { border: 2px solid var(--brand-deep); padding: 6px 7px; }
  .day.empty { background: transparent; border: none; cursor: default; }
  .day.past { opacity: .5; background: var(--past); }
  .day .num { font-size: 13px; font-weight: 600; margin-bottom: 5px; }
  .day.today .num {
    display: inline-block; background: var(--brand-deep); color: #fff; border-radius: 8px;
    padding: 1px 7px;
  }
  .chips { display: flex; flex-wrap: wrap; gap: 3px; }
  .chip { width: 14px; height: 14px; border-radius: 5px; }
  .chip.reel { background: var(--reel); }
  .chip.trial { background: var(--trial); border: 1px solid rgba(0,0,0,.06); }
  .chip.post { background: var(--post); }
  .more { font-size: 10px; color: var(--ink-soft); }

  /* ---------- Счётчики месяца ---------- */
  .counters { display: flex; justify-content: center; gap: 26px; margin-top: 14px; font-size: 14px; color: var(--ink); flex-wrap: wrap; }
  .counters .cnt { display: inline-flex; align-items: center; gap: 8px; }
  .counters .sq { width: 16px; height: 16px; border-radius: 5px; display: inline-block; }
  .counters .sq.reel { background: var(--reel); }
  .counters .sq.trial { background: var(--trial); border: 1px solid rgba(0,0,0,.06); }
  .counters .sq.post { background: var(--post); }
  .counters b { font-size: 15px; font-weight: 700; }
  .counters .lbl { color: var(--ink-soft); }
  /* ---------- Бренд недели ---------- */
  .botw {
    background: var(--brand-soft); border: 1px solid var(--line); border-radius: 14px;
    padding: 14px 16px; margin-top: 14px;
  }
  .botw-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
  .botw-label { font-size: 12px; color: var(--ink-soft); margin-bottom: 2px; }
  .botw-brand { font-size: 19px; font-weight: 700; }
  .botw-dates { font-size: 13px; color: var(--ink-soft); margin-top: 2px; }
  .botw-btn {
    border: 1px solid var(--brand); background: var(--card); color: var(--brand-deep);
    font-size: 12px; font-weight: 600; padding: 7px 12px; border-radius: 10px; cursor: pointer;
  }
  .botw-btn:hover { background: var(--brand-soft); }
  .botw-list { margin-top: 12px; border-top: 1px solid var(--line); padding-top: 8px; display: none; }
  .botw-item { display: flex; justify-content: space-between; gap: 10px; padding: 6px 0; font-size: 14px; color: var(--ink); }
  .botw-item .bw-dates { color: var(--ink-soft); white-space: nowrap; }
  .botw-item.current { font-weight: 700; }
  .botw-item.past { opacity: .5; }

  /* ---------- День ---------- */
  #day-panel { margin-top: 26px; }
  #day-panel h3 { font-size: 16px; margin-bottom: 12px; text-transform: capitalize; }
  .post-card {
    background: var(--card); border: 1px solid var(--line); border-radius: 16px;
    padding: 14px; margin-bottom: 12px; display: flex; gap: 14px; align-items: flex-start;
  }
  .thumb { flex: 0 0 128px; position: relative; }
  .thumb video, .thumb img {
    width: 128px; height: 180px; object-fit: cover; border-radius: 10px; background: #10151c;
  }
  .thumb video { cursor: pointer; }
  .thumb img { background: #eef2f7; display: block; }
  .play-overlay {
    position: absolute; inset: 0; display: none; align-items: center; justify-content: center;
    background: rgba(20, 25, 35, .35); border-radius: 10px; cursor: pointer;
  }
  .play-overlay .pbtn {
    width: 46px; height: 46px; border-radius: 50%; background: rgba(255, 255, 255, .92);
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 2px 10px rgba(0,0,0,.25);
  }
  .post-body { flex: 1; min-width: 0; }
  .post-top { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 7px; }
  .time { font-weight: 700; font-size: 14px; }
  .badge { font-size: 11px; font-weight: 700; padding: 3px 10px; border-radius: 999px; }
  .badge.reel { background: var(--reel); color: #fff; }
  .badge.trial { background: var(--trial); color: var(--trial-ink); }
  .badge.post { background: var(--post); color: var(--post-ink); }
  .badge.pub { background: #e5f4e9; color: #3b8a58; }
  .badge.feed { background: #eef1f6; color: #55677f; }
  .post-title { font-size: 14px; font-weight: 600; margin-bottom: 6px; line-height: 1.35; }
  .post-text { font-size: 13px; color: var(--ink-soft); white-space: pre-wrap; line-height: 1.5; }
  .post-text.clamped { max-height: 60px; overflow: hidden; }
  .toggle-text {
    background: none; border: none; color: var(--brand-deep); font-size: 12px; cursor: pointer;
    padding: 0; margin-top: 6px; font-weight: 600;
  }
  .post-actions { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin-top: 8px; }
  .copy-btn {
    border: 1px solid var(--line); background: var(--card); color: var(--brand-deep);
    font-size: 12px; font-weight: 600; padding: 5px 11px; border-radius: 9px; cursor: pointer;
  }
  .copy-btn:hover { border-color: var(--brand); }
  .copy-btn.done { color: #2e9b55; border-color: #2e9b55; }
  .post-link { font-size: 12px; color: var(--brand-deep); text-decoration: none; }
  .post-link:hover { text-decoration: underline; }

  .empty-day { color: var(--ink-soft); font-size: 14px; background: var(--card); border: 1px dashed var(--line); border-radius: 14px; padding: 22px; text-align: center; }

  @media (max-width: 560px) {
    .post-card { flex-direction: column; }
    .thumb video, .thumb img { width: 100%; height: 200px; }
    .channel-toggle { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 8px; }
    .channel-toggle button { padding: 8px 6px; font-size: 11.5px; }
  }
</style>
</head>
<body data-brand="peshkov">

<!-- Экран входа -->
<div id="lock">
  <div class="lock-card">
    <h1>Календарь публикаций</h1>
    <p>Контент-план Instagram. Введите пароль.</p>
    <input id="pwd" type="password" inputmode="numeric" autocomplete="off" placeholder="••••">
    <button id="unlock-btn">Войти</button>
    <div id="lock-err"></div>
  </div>
</div>

<!-- Приложение -->
<div id="app" style="display:none">
  <div class="wrap">
    <header>
      <h1 class="title">Календарь публикаций</h1>
      <button class="theme-btn" id="theme-btn" title="Тёмная / светлая тема">☾</button>
      <div class="updated" id="updated"></div>
    </header>

    <div class="platform-tabs" id="platform-tabs">
      <button data-platform="instagram" class="active">INSTAGRAM</button>
      <button data-platform="youtube">YOUTUBE</button>
    </div>

    <div class="channel-toggle" id="channel-toggle"></div>

    <div class="month-nav">
      <button id="prev-month" title="Предыдущий месяц">‹</button>
      <h2 id="month-label"></h2>
      <button id="next-month" title="Следующий месяц">›</button>
    </div>

    <div class="grid" id="calendar"></div>

    <div class="counters" id="counters"></div>

    <div class="botw">
      <div class="botw-head">
        <div>
          <div class="botw-label">Бренд недели</div>
          <div class="botw-brand" id="botw-current"></div>
          <div class="botw-dates" id="botw-dates"></div>
        </div>
        <button class="botw-btn" id="botw-toggle">Все бренды недели</button>
      </div>
      <div class="botw-list" id="botw-list"></div>
    </div>

    <div id="day-panel"></div>
  </div>
</div>

<script>
const PASS_HASH = "888df25ae35772424a560c7152a1de794440e0ea5cfee62828333a456a506e05";
const MONTHS = ["Январь","Февраль","Март","Апрель","Май","Июнь","Июль","Август","Сентябрь","Октябрь","Ноябрь","Декабрь"];
const DOWS = ["Пн","Вт","Ср","Чт","Пт","Сб","Вс"];

let DATA = null;
/* Триал-рилсы с автопереходом в ленту (по заметкам из чата): brand|час триала -> дата выхода в ленту */
let FEED_MAP = {};
let platform = "instagram";       // instagram | youtube
let channel = "peshkov";          // instagram: peshkov|shopomaniia; youtube: yt-man|yt-classic|yt-shop
let viewYear, viewMonth;          // просматриваемый месяц
let selectedDay = null;           // "YYYY-MM-DD"
let todayStr = "";

const pad = n => String(n).padStart(2, "0");
const fmtNum = n => Number(n).toLocaleString("ru-RU");
const dayKey = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;

async function sha256(text) {
  const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(text));
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, "0")).join("");
}

/* ---------- Вход ---------- */
async function tryUnlock() {
  const v = document.getElementById("pwd").value;
  const err = document.getElementById("lock-err");
  if (await sha256(v) === PASS_HASH) {
    sessionStorage.setItem("cal_unlocked", "1");
    boot();
  } else {
    err.textContent = "Неверный пароль";
    document.getElementById("pwd").value = "";
  }
}
document.getElementById("unlock-btn").addEventListener("click", tryUnlock);
document.getElementById("pwd").addEventListener("keydown", e => { if (e.key === "Enter") tryUnlock(); });

/* ---------- Загрузка ---------- */
async function boot() {
  document.getElementById("lock").style.display = "none";
  document.getElementById("app").style.display = "block";
  const res = await fetch("data.json?ts=" + Date.now());
  DATA = await res.json();
  FEED_MAP = {};
  (DATA.trialNotes || []).forEach(n => {
    FEED_MAP[n.brand + "|" + (n.trialAt || "").slice(0, 13)] = n.feedAt;
  });
  const now = new Date();
  todayStr = dayKey(now);
  viewYear = now.getFullYear(); viewMonth = now.getMonth();
  buildChannelToggle();
  document.getElementById("updated").textContent =
    "Данные обновлены: " + new Date(DATA.updatedAt).toLocaleString("ru-RU") + " (" + (DATA.timezone || "") + ")";
  render();
  initBrandOfWeek();
}

/* ---------- Переключатель каналов (под вкладками платформ) ---------- */
const YT_CHANNELS = [
  { id: "yt-man", name: "PESHKOV SHOES MAN" },
  { id: "yt-classic", name: "PESHKOV SHOES CLASSIC" },
  { id: "yt-shop", name: "SHOPOMANIIA2012" },
];

function buildChannelToggle() {
  const el = document.getElementById("channel-toggle");
  el.innerHTML = "";
  const list = platform === "instagram" ? DATA.brands : YT_CHANNELS;
  const followers = (platform === "instagram" && DATA.followers) || {};
  list.forEach(b => {
    const wrap = document.createElement("div");
    wrap.className = "ch";
    const btn = document.createElement("button");
    btn.textContent = b.name;
    btn.className = b.id === channel ? "active" : "";
    btn.onclick = () => {
      channel = b.id;
      if (platform === "instagram") document.body.dataset.brand = channel;
      buildChannelToggle();
      render();
    };
    wrap.appendChild(btn);
    const f = followers[b.id];
    if (f) {
      const fol = document.createElement("div");
      fol.className = "fol";
      const d = f.delta;
      const delta = d == null ? "" : d >= 0
        ? `<span class="up">+${fmtNum(d)}</span>`
        : `<span class="down">−${fmtNum(-d)}</span>`;
      fol.innerHTML = `<b>${fmtNum(f.count)}</b>${delta}`;
      if (f.date) fol.title = "Подписчики Instagram по данным Metricool на " +
        f.date.slice(8, 10) + "." + f.date.slice(5, 7) + "; прирост — за этот день";
      wrap.appendChild(fol);
    }
    el.appendChild(wrap);
  });
}

/* ---------- Календарь ---------- */
function postsByDay() {
  const map = {};
  if (platform !== "instagram") return map;      // youtube пока без данных
  DATA.posts.filter(p => p.brand === channel).forEach(p => {
    const k = p.date.slice(0, 10);
    (map[k] = map[k] || []).push(p);
  });
  Object.values(map).forEach(list => list.sort((a, b) => a.date.localeCompare(b.date)));
  return map;
}

/* ---------- Вкладки INSTAGRAM / YOUTUBE ---------- */
function updatePlatformUI() {
  const yt = platform === "youtube";
  document.querySelector(".botw").style.display = yt ? "none" : "";
  document.querySelector(".counters").style.display = yt ? "none" : "";
  document.querySelectorAll("#platform-tabs button").forEach(b =>
    b.classList.toggle("active", b.dataset.platform === platform));
}
document.querySelectorAll("#platform-tabs button").forEach(b => {
  b.addEventListener("click", () => {
    if (platform === b.dataset.platform) return;
    platform = b.dataset.platform;
    channel = platform === "instagram" ? "peshkov" : "yt-man";
    if (platform === "instagram") document.body.dataset.brand = channel;
    selectedDay = null;
    updatePlatformUI();
    buildChannelToggle();
    render();
  });
});

function render() {
  const label = document.getElementById("month-label");
  label.textContent = `${MONTHS[viewMonth]} ${viewYear}`;

  const cal = document.getElementById("calendar");
  cal.innerHTML = "";
  DOWS.forEach(d => {
    const el = document.createElement("div");
    el.className = "dow"; el.textContent = d;
    cal.appendChild(el);
  });

  const first = new Date(viewYear, viewMonth, 1);
  let offset = (first.getDay() + 6) % 7;             // неделя с понедельника
  const daysInMonth = new Date(viewYear, viewMonth + 1, 0).getDate();
  const byDay = postsByDay();

  for (let i = 0; i < offset; i++) {
    const e = document.createElement("div"); e.className = "day empty"; cal.appendChild(e);
  }
  for (let d = 1; d <= daysInMonth; d++) {
    const date = new Date(viewYear, viewMonth, d);
    const k = dayKey(date);
    const cell = document.createElement("div");
    cell.className = "day";
    if (k === todayStr) cell.classList.add("today");
    if (k < todayStr) cell.classList.add("past");
    cell.innerHTML = `<div class="num">${d}</div>`;

    const posts = byDay[k];
    if (posts && posts.length) {
      const chips = document.createElement("div");
      chips.className = "chips";
      posts.slice(0, 6).forEach(p => {
        const c = document.createElement("div");
        c.className = "chip " + ((p.manual || isImgPost(p)) ? "post" : p.trial ? "trial" : "reel");
        c.title = p.title;
        chips.appendChild(c);
      });
      if (posts.length > 6) {
        const m = document.createElement("span");
        m.className = "more"; m.textContent = "+" + (posts.length - 6);
        chips.appendChild(m);
      }
      cell.appendChild(chips);
    }
    cell.onclick = () => { selectedDay = k; render(); renderDay(); scrollToDay(); };
    if (selectedDay === k) cell.classList.add("selected");
    cal.appendChild(cell);
  }
  renderCounters();
  renderDay();
}

/* ---------- Счётчики: выбранный канал + открытый месяц ---------- */
function renderCounters() {
  const el = document.getElementById("counters");
  if (platform !== "instagram") { el.innerHTML = ""; return; }
  const ym = `${viewYear}-${pad(viewMonth + 1)}`;
  let trial = 0, reel = 0, post = 0;
  DATA.posts.forEach(p => {
    if (p.brand !== channel || p.date.slice(0, 7) !== ym) return;
    if (p.manual || isImgPost(p)) post++;
    else if (p.trial) trial++;
    else reel++;
  });
  el.innerHTML = `
    <span class="cnt"><i class="sq trial"></i><b>${trial}</b><span class="lbl">Триал Рилс</span></span>
    <span class="cnt"><i class="sq reel"></i><b>${reel}</b><span class="lbl">Рилс</span></span>
    <span class="cnt"><i class="sq post"></i><b>${post}</b><span class="lbl">Пост</span></span>`;
}

function scrollToDay() {
  document.getElementById("day-panel").scrollIntoView({ behavior: "smooth", block: "nearest" });
}

/* Фото-карусель/пост — картинка по расширению, рилс — видео */
function isImgPost(p) {
  const url = p.thumb || p.video || "";
  return /\.(png|jpe?g|webp|gif|avif)(\?|#|$)/i.test(url);
}

/* ---------- Панель дня ---------- */
function esc(s) {
  return s.replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

function renderDay() {
  const panel = document.getElementById("day-panel");
  if (!selectedDay) { panel.innerHTML = ""; return; }

  const posts = (postsByDay()[selectedDay] || []);
  const [y, m, d] = selectedDay.split("-").map(Number);
  const dateObj = new Date(y, m - 1, d);
  const dateLabel = dateObj.toLocaleDateString("ru-RU", { weekday: "long", day: "numeric", month: "long" });

  if (platform === "youtube") {
    panel.innerHTML = `<h3>${dateLabel}</h3>
      <div class="empty-day">Данные о публикациях YouTube появятся здесь позже</div>`;
    return;
  }

  let html = `<h3>${dateLabel}</h3>`;
  if (!posts.length) {
    html += `<div class="empty-day">Нет запланированных публикаций</div>`;
    panel.innerHTML = html;
    return;
  }
  posts.forEach((p, idx) => {
    const time = p.date.slice(11, 16);
    const badge = (p.manual || isImgPost(p))
      ? `<span class="badge post">Пост</span>`
      : p.trial
        ? `<span class="badge trial">Триал Рилс</span>`
        : `<span class="badge reel">Рилс</span>`;
    const pub = p.status === "Published" ? `<span class="badge pub">Опубликовано</span>` : "";
    const feedAt = p.trial ? FEED_MAP[p.brand + "|" + p.date.slice(0, 13)] : null;
    const feed = feedAt
      ? `<span class="badge feed">→ в ленту ${feedAt.slice(8, 10)}.${feedAt.slice(5, 7)} ${feedAt.slice(11, 16)}</span>`
      : "";
    const link = p.url ? `<a class="post-link" href="${esc(p.url)}" target="_blank" rel="noopener">Открыть в Instagram ↗</a>` : "";
    const body = bodyText(p);
    const media = mediaHtml(p.thumb || p.video);
    html += `
      <div class="post-card">
        ${media}
        <div class="post-body">
          <div class="post-top">
            <span class="time">${time}</span>
            ${badge}
            ${pub}
            ${feed}
          </div>
          <div class="post-title">${esc(p.title)}</div>
          ${body ? `<div class="post-text clamped" id="txt-${idx}">${esc(body)}</div>
          <button class="toggle-text" onclick="toggleText(${idx}, this)">Показать текст полностью</button>` : ""}
          <div class="post-actions">
            <button class="copy-btn" onclick="copyText(${idx}, this)">Скопировать текст</button>
            ${link}
          </div>
        </div>
      </div>`;
  });
  panel.innerHTML = html;
  DAY_POSTS = posts;
  initVideos();
}

/* Текст без повтора заголовка: если пост начинается с той же строки — срезаем её */
function bodyText(p) {
  const text = (p.text || "").trim();
  const title = (p.title || "").trim();
  if (title && text.startsWith(title)) return text.slice(title.length).replace(/^\s+/, "");
  return text;
}

/* Копирование полного текста поста (как в Metricool, с заголовком) */
let DAY_POSTS = [];
window.copyText = async (idx, btn) => {
  const text = (DAY_POSTS[idx] && DAY_POSTS[idx].text) || "";
  try {
    await navigator.clipboard.writeText(text);
  } catch (e) {
    const ta = document.createElement("textarea");
    ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.select();
    try { document.execCommand("copy"); } catch (e2) {}
    ta.remove();
  }
  btn.textContent = "Скопировано ✓"; btn.classList.add("done");
  setTimeout(() => { btn.textContent = "Скопировать текст"; btn.classList.remove("done"); }, 1600);
};

window.toggleText = (idx, btn) => {
  const el = document.getElementById("txt-" + idx);
  el.classList.toggle("clamped");
  btn.textContent = el.classList.contains("clamped") ? "Показать текст полностью" : "Свернуть текст";
};

/* Картинка (карусель/пост) — <img>, видео (рилс) — <video> с первым кадром */
function mediaHtml(url) {
  if (!url) return '<div class="thumb"></div>';
  if (/\.(png|jpe?g|webp|gif|avif)(\?|#|$)/i.test(url)) {
    return `<div class="thumb"><img src="${esc(url)}" alt="" loading="lazy"></div>`;
  }
  return `<div class="thumb"><video muted playsinline preload="metadata" data-src="${esc(url)}"></video></div>`;
}

/* Превью: показываем первый кадр, клик — play/pause со звуком,
   на паузе — полупрозрачная кнопка play поверх видео */
function initVideos() {
  document.querySelectorAll("#day-panel video").forEach(v => {
    const wrap = v.closest(".thumb");
    let ov = wrap.querySelector(".play-overlay");
    if (!ov) {
      ov = document.createElement("div");
      ov.className = "play-overlay";
      ov.innerHTML = '<div class="pbtn"><svg viewBox="0 0 24 24" width="22" height="22"><path d="M8 5v14l11-7z" fill="#24344a"/></svg></div>';
      wrap.appendChild(ov);
    }
    let started = false;
    const show = () => { ov.style.display = "flex"; };
    const hide = () => { ov.style.display = "none"; };
    v.src = v.dataset.src + "#t=0.1";
    v.addEventListener("loadedmetadata", () => { try { v.currentTime = 0.1; } catch (e) {} });
    v.addEventListener("play", () => { started = true; hide(); });
    v.addEventListener("pause", () => { if (started && !v.ended) show(); });
    v.addEventListener("ended", () => { started = false; v.currentTime = 0; show(); });
    const toggle = () => {
      if (v.paused) { v.muted = false; v.play(); }
      else { v.pause(); }
    };
    v.addEventListener("click", toggle);
    ov.addEventListener("click", toggle);
  });
}

/* ---------- Бренд недели ---------- */
const BRAND_WEEKS = [
  ["New Balance", "2026-09-14", "2026-09-27"],
  ["Timberland", "2026-09-28", "2026-10-11"],
  ["UGG", "2026-10-12", "2026-10-25"],
  ["Aritzia", "2026-10-26", "2026-11-08"],
  ["Costco", "2026-11-09", "2026-11-22"],
  ["Tiffany", "2026-11-23", "2026-12-06"],
  ["Ralph Lauren", "2026-12-07", "2026-12-20"],
  ["Beauty (все бренды косметики)", "2026-12-21", "2027-01-03"],
];
const MONTHS_GEN = ["января","февраля","марта","апреля","мая","июня","июля","августа","сентября","октября","ноября","декабря"];

function fmtRange(start, end) {
  const s = new Date(start + "T00:00:00"), e = new Date(end + "T00:00:00");
  return `${s.getDate()} ${MONTHS_GEN[s.getMonth()]} — ${e.getDate()} ${MONTHS_GEN[e.getMonth()]}`;
}

function initBrandOfWeek() {
  const curEl = document.getElementById("botw-current");
  const datesEl = document.getElementById("botw-dates");
  const listEl = document.getElementById("botw-list");
  const btn = document.getElementById("botw-toggle");

  let currentIdx = BRAND_WEEKS.findIndex(([ , s, e]) => todayStr >= s && todayStr <= e);
  if (currentIdx === -1) {
    const next = BRAND_WEEKS.findIndex(([ , s]) => s > todayStr);
    currentIdx = next === -1 ? BRAND_WEEKS.length - 1 : next;
  }
  const [name, start, end] = BRAND_WEEKS[currentIdx];
  const isCurrent = todayStr >= start && todayStr <= end;
  curEl.textContent = name;
  datesEl.textContent = fmtRange(start, end) + (isCurrent ? "" : (todayStr < start ? " (скоро)" : " (завершено)"));

  listEl.innerHTML = BRAND_WEEKS.map(([n, s, e], i) => {
    const cls = i === currentIdx ? "botw-item current" : (e < todayStr ? "botw-item past" : "botw-item");
    return `<div class="${cls}"><span>${n}</span><span class="bw-dates">${fmtRange(s, e)}</span></div>`;
  }).join("");

  btn.addEventListener("click", () => {
    const open = listEl.style.display !== "block";
    listEl.style.display = open ? "block" : "none";
    btn.textContent = open ? "Свернуть список" : "Все бренды недели";
  });
}

/* ---------- Месяцы ---------- */
document.getElementById("prev-month").addEventListener("click", () => {
  viewMonth--; if (viewMonth < 0) { viewMonth = 11; viewYear--; }
  render();
});
document.getElementById("next-month").addEventListener("click", () => {
  viewMonth++; if (viewMonth > 11) { viewMonth = 0; viewYear++; }
  render();
});

/* ---------- Тема ---------- */
function applyTheme(dark) {
  document.body.classList.toggle("dark", dark);
  document.getElementById("theme-btn").textContent = dark ? "☀" : "☾";
}
(() => {
  let saved = null;
  try { saved = localStorage.getItem("cal_theme"); } catch (e) {}
  const dark = saved ? saved === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
  applyTheme(dark);
})();
document.getElementById("theme-btn").addEventListener("click", () => {
  const dark = !document.body.classList.contains("dark");
  applyTheme(dark);
  try { localStorage.setItem("cal_theme", dark ? "dark" : "light"); } catch (e) {}
});

/* ---------- Старт ---------- */
if (sessionStorage.getItem("cal_unlocked") === "1") {
  boot();
} else {
  setTimeout(() => document.getElementById("pwd").focus(), 100);
}
